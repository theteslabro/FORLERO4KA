<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b6c"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Фон свечения -->
  <circle cx="32" cy="32" r="30" fill="#1e101c" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Сердце с подсветкой -->
  <g filter="url(#glow)">
    <path d="M32 54 C32 54 10 40 10 24 C10 14 18 8 26 12 C29 13.5 31 16 32 18 C33 16 35 13.5 38 12 C46 8 54 14 54 24 C54 40 32 54 32 54 Z"
          fill="url(#heartGrad)" />
  </g>

  <!-- Блик на сердце -->
  <path d="M20 16 C25 12 30 15 31 18 C28 17 22 17 17 22 C15 24 14 27 14 26 C13 22 16 18 20 16 Z"
        fill="url(#shineGrad)" />

  <!-- Корона -->
  <path d="M22 14 L20 6 L26 10 L32 4 L38 10 L44 6 L42 14 Z"
        fill="url(#crownGrad)"
        stroke="#a16207"
        stroke-width="0.8"
        stroke-linejoin="round" />
  <circle cx="20" cy="6" r="1.5" fill="#fef08a" />
  <circle cx="32" cy="4" r="1.8" fill="#fef08a" />
  <circle cx="44" cy="6" r="1.5" fill="#fef08a" />
  <circle cx="32" cy="11" r="1.5" fill="#f43f5e" />

  <!-- Искорки -->
  <polygon points="50,14 52,17 55,17 53,19 54,22 51,20 48,22 49,19 47,17 50,17" fill="#fef08a" />
  <polygon points="14,36 15,38 17,38 16,39 16,41 15,40 13,41 14,39 12,38 14,38" fill="#ffffff" opacity="0.9" />
</svg>
